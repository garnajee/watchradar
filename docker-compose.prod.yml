name: watchradar

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: watchradar
      POSTGRES_USER: watchradar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchradar -d watchradar"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
      - /var/run/postgresql:rw,nosuid,noexec,size=8m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    image: ghcr.io/garnajee/watchradar-backend:${WATCHRADAR_VERSION:-latest}
    pull_policy: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: "3000"
      DATABASE_URL: postgresql://watchradar:${DB_PASSWORD}@db:5432/watchradar
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      JELLYFIN_TLS_REJECT_UNAUTHORIZED: ${JELLYFIN_TLS_REJECT_UNAUTHORIZED:-true}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: ghcr.io/garnajee/watchradar-frontend:${WATCHRADAR_VERSION:-latest}
    pull_policy: always
    ports:
      - "${WATCHRADAR_BIND_ADDRESS:-0.0.0.0}:${WATCHRADAR_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
